services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lista_tarefas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dados_postgres:/var/lib/postgresql/data

  aplicacao:
    build: .
    depends_on:
      - banco
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@banco:5432/lista_tarefas
      DATABASE_SSL: "false"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  dados_postgres:
