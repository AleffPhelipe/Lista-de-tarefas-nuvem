services:
  - type: web
    name: lista-tarefas-nuvem
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banco-lista-tarefas
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: banco-lista-tarefas
    plan: free
    databaseName: lista_tarefas
    user: tarefas_user
